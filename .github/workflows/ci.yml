name: CI & Deployment Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run Vitest unit & integration tests
        run: npm run test

      - name: Build Next.js production bundle
        run: npm run build
        env:
          NEXT_PUBLIC_NEON_AUTH_URL: https://ep-demo.neonauth.tech/neondb/auth
          DATABASE_URL: postgresql://mock:mock@localhost:5432/mock
