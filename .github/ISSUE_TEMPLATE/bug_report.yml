name: Bug Report
description: Create a report to help us improve Orqestra
title: "fix: [short description of the issue]"
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Before submitting, please verify that the bug hasn't already been reported in existing issues.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the problem...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: dropdown
    id: theme
    attributes:
      label: Active Theme
      description: Which theme mode were you using when the issue occurred?
      options:
        - Dark Graphite Theme
        - Light Mode
        - System Preference
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: |
        Please specify browser, OS, and Node version (if running locally).
      placeholder: |
        - OS: [e.g. macOS 14.5, Ubuntu 24.04, Windows 11]
        - Browser: [e.g. Chrome 128, Firefox 130, Safari 18]
        - Node Version (if self-hosting): [e.g. 20.14.0]
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Console Logs or Error Traces
      description: Please copy and paste any browser console errors or terminal stack traces here.
      render: shell
  - type: checkboxes
    id: checklist
    attributes:
      label: Verification Checklist
      options:
        - label: I have searched existing issues and confirmed this is not a duplicate.
          required: true
        - label: I am using the latest version of Orqestra or main branch.
          required: false
